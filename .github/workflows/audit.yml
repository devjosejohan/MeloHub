name: melohub-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: melohub-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: MeloHub audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audit/
          if-no-files-found: warn
          retention-days: 7
